name: Temporary baseline test comparison

on:
  push:
    branches:
      - chore/baseline-test-verify-2026-11-25
    paths:
      - .github/workflows/temporary-baseline-tests.yml

permissions:
  contents: read

jobs:
  baseline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install original locked dependencies
        run: npm ci
      - name: Run baseline unit and integration tests
        run: npm run test:run
