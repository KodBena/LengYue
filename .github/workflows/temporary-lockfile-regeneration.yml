name: Temporary npm lockfile regeneration

on:
  push:
    branches:
      - chore/security-dependency-refresh-2026-11-25
    paths:
      - frontend/package.json
      - .github/workflows/temporary-lockfile-regeneration.yml

permissions:
  contents: write

jobs:
  regenerate-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use current npm 11 lockfile resolver
        run: npm install --global npm@11.21.3
      - name: Regenerate package lock with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        working-directory: .
        run: |
          if ! git diff --quiet -- frontend/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/package-lock.json
            git commit -m "chore(deps): regenerate npm lockfile"
            git push
          fi
      - name: Install exact locked dependency graph
        run: npm ci
      - name: Typecheck and production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm run test:run

  baseline-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: base/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: base/frontend/package-lock.json
      - name: Use current npm 11 lockfile resolver
        run: npm install --global npm@11.21.3
      - name: Install base-branch locked dependencies
        run: npm ci
      - name: Lint base branch with original lockfile
        run: npm run lint
