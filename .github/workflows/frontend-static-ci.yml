# Frontend code validation only.
# No change-impact classifier or non-test audits are part of this workflow.
name: frontend-static-ci

on:
  pull_request:
    paths:
      - 'frontend/**'
  push:
    branches: [main]
    paths:
      - 'frontend/**'

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  frontend-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npx vue-tsc -b
      - name: Lint
        run: npx eslint .
      - name: Production build
        run: npm run build
