# .github/workflows/doc-graph-ci.yml
#
# Dormant doc-graph freshness workflow.
#
# The project is in maintenance mode and the maintainer no longer has access to
# the specialized agent environment needed to maintain the documentation graph
# at its former granularity. The graph is therefore not an acceptance criterion
# for maintenance-mode changes.
#
# Preserve this workflow and tools/doc-graph/generate.mjs for a future
# maintainer who can resume graph maintenance with the required discipline.
# It is intentionally not triggered by pull requests or pushes. A maintainer
# may invoke it manually with workflow_dispatch when intentionally validating
# or refreshing the graph.
#
# License: Public Domain (The Unlicense)
name: doc-graph-ci

on:
  workflow_dispatch:

# Least privilege: checkout + read-only freshness check only; no writes.
permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: commit-distance (the heatmap) needs git log/rev-list.
          fetch-depth: 0
          # Submodules excluded: proxy/ is out of scope for the doc-graph.
          submodules: false
      # Harness-envelope artifact gate: tool-generated docs can leak literal
      # tool-call envelope lines. Whole-line anchored so docs that legitimately
      # quote the strings inline pass.
      - name: Harness-envelope artifact grep (docs/ carries no leaked tool-call envelope lines)
        run: "! grep -rnE '^[[:space:]]*</?(content|invoke|antml:invoke)>[[:space:]]*$' docs/"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No Graphviz install: --check does not render the SVG.
      - name: Check doc-graph artifact freshness
        run: node tools/doc-graph/generate.mjs --check
