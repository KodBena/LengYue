version: 2

updates:
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 10
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"

  - package-ecosystem: cargo
    directory: "/frontend/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
