# frontend/nginx.conf
#
# Static-file serving for the built Vue 3 SPA. SPA history-mode routing:
# any path nginx can't resolve to a real file falls back to index.html so
# client-side routing (Vue Router) handles it instead of nginx 404ing on
# a deep link / page refresh.
#
# Listens on 8080, not 80: this file is paired with the
# nginxinc/nginx-unprivileged base image (see frontend/Dockerfile), which
# runs nginx as a non-root user — non-root processes can't bind port 80.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets Vite content-hashes in their filenames (dist/assets/*)
    # are safe to cache aggressively; index.html is not (it references the
    # current hashed filenames) and keeps nginx's default no-cache-by-ETag
    # behavior.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
